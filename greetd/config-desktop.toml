# greetd on tty7 next to a desktop: text login (agreety), then sway + fullscreen Alacritty (see make debian-sway-desktop).
# SDDM takes the first free VTs (greeter, Plasma) and the boot screen; Ctrl+Alt+F7 opens sway.
[terminal]
vt = 7
# Stay on the display manager's VT on boot
switch = false

[default_session]
command = "/usr/sbin/agreety --cmd /home/anasyrov/dotfiles/sway-alacritty.sh"
user = "_greetd"
