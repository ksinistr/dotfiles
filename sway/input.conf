# Keyboard shared by sway/config and sway/alacritty.conf. Layout and Ctrl+Space switching follow kmscon/kmscon.conf.
input type:keyboard {
    xkb_layout us,ru
    xkb_options ctrl:nocaps
    repeat_delay 200
    repeat_rate 40
}

# Not grp:ctrl_space_toggle: XKB ignores Shift there, so it also eats Ctrl+Shift+Space (Alacritty's vi mode).
# bindsym matches modifiers exactly, so Ctrl+Shift+Space still reaches Alacritty.
bindsym ctrl+space input type:keyboard xkb_switch_layout next
