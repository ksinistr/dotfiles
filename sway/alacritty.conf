# Minimal sway session running a single fullscreen Alacritty on a bare TTY (see sway-alacritty.sh).
# Unlike cage, sway lets us set key repeat.
include input.conf

# sway auto-picks scale 2 on HiDPI panels; set it explicitly and tune text size together with font.size below
output * scale 0.75

default_border none
for_window [app_id="Alacritty"] fullscreen enable

# Leave sway when Alacritty exits, as cage does
exec "alacritty -o font.size=42; swaymsg exit"
