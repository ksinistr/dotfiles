# Minimal sway session running a single fullscreen Alacritty on a bare TTY (see sway-alacritty.sh).
# Unlike cage, sway lets us set key repeat. Layout and Ctrl+Space switching follow kmscon/kmscon.conf.
input type:keyboard {
    xkb_layout us,ru
    xkb_options ctrl:nocaps
    repeat_delay 200
    repeat_rate 40
}

# Not grp:ctrl_space_toggle: XKB ignores Shift there, so it also eats Ctrl+Shift+Space (Alacritty's vi mode).
# bindsym matches modifiers exactly, so Ctrl+Shift+Space still reaches Alacritty.
bindsym ctrl+space input type:keyboard xkb_switch_layout next

# sway auto-picks scale 2 on HiDPI panels; set it explicitly and tune text size together with font.size below
output * scale 0.75

default_border none
for_window [app_id="Alacritty"] fullscreen enable

# Leave sway when Alacritty exits, as cage does
exec "alacritty -o font.size=42; swaymsg exit"
